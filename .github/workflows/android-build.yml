name: Generate Release Keystore (run once, then delete this file)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (choose a strong one, you will need it later)'
        required: true
      key_password:
        description: 'Key password (can be same as store password)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore khelkidz-release.keystore \
            -alias khelkidz-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=KhelKidz, OU=Dev, O=KhelKidz, L=City, S=State, C=IN"

      - name: Create base64 version for GitHub Secrets
        run: base64 -w 0 khelkidz-release.keystore > khelkidz-release.keystore.base64.txt

      - name: Upload keystore and base64 text as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khelkidz-keystore-DOWNLOAD-AND-BACKUP-THIS
          path: |
            khelkidz-release.keystore
            khelkidz-release.keystore.base64.txt
          retention-days: 1